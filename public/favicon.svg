<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="simpleBlue" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>
  <g stroke="url(#simpleBlue)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arm 1 & 4 (Vertical) -->
    <g>
      <line x1="50" y1="8" x2="50" y2="92" />
      <polyline points="37,19 50,31 63,19" />
      <polyline points="37,81 50,69 63,81" />
    </g>
    <!-- Arm 2 & 5 (60 deg) -->
    <g transform="rotate(60 50 50)">
      <line x1="50" y1="8" x2="50" y2="92" />
      <polyline points="37,19 50,31 63,19" />
      <polyline points="37,81 50,69 63,81" />
    </g>
    <!-- Arm 3 & 6 (120 deg) -->
    <g transform="rotate(120 50 50)">
      <line x1="50" y1="8" x2="50" y2="92" />
      <polyline points="37,19 50,31 63,19" />
      <polyline points="37,81 50,69 63,81" />
    </g>
  </g>
  <!-- Clean Center Circle -->
  <circle cx="50" cy="50" r="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="5" />
</svg>
